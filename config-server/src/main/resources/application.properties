spring.application.name=config-server
server.port=8888

spring.profiles.active=native
# Resolved against the working directory: ./config-repo when started from config-server/ or the Docker image,
# ./config-server/config-repo when started from the project root (IntelliJ default).
spring.cloud.config.server.native.search-locations=file:./config-repo/,file:./config-server/config-repo/

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
