spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/claim_service_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# The claim outbox poll and its metrics refresh query claim_outbox every few seconds, so printing every statement
# (spring.jpa.show-sql=true in the shared application.properties) floods the console. Application, Flyway and
# outbox logs are unaffected. To inspect SQL temporarily, use logging.level.org.hibernate.SQL=DEBUG
# (and logging.level.org.hibernate.orm.jdbc.bind=TRACE for bind values) instead of show-sql.
spring.jpa.show-sql=false
