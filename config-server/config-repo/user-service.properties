spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/user_service_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# Password reset (forgot-password / reset-password). All values come from user-service's environment; see
# .env.example. Without BTC_MAIL_HOST, BTC_MAIL_FROM and BTC_FRONTEND_BASE_URL the feature answers 503.
spring.mail.host=${BTC_MAIL_HOST:}
spring.mail.port=${BTC_MAIL_PORT:587}
spring.mail.username=${BTC_MAIL_USERNAME:}
spring.mail.password=${BTC_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${BTC_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${BTC_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${BTC_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
btc.password-reset.mail-from=${BTC_MAIL_FROM:}
btc.password-reset.frontend-base-url=${BTC_FRONTEND_BASE_URL:}
btc.password-reset.token-ttl=${BTC_PASSWORD_RESET_TTL:PT15M}
