management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Shared settings for every Config Server client. ${...} placeholders are served unresolved and
# resolved by each client from its OWN environment, so every client must receive these variables.
# No defaults for secrets: a client missing them fails at startup.

# Datasource credentials and JPA settings shared by user, trip, expense and claim services.
# Each service keeps its own JDBC URL (and database) in <service-name>.properties.
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT settings shared by api-gateway, user, trip, expense and claim services (HS256).
btc.security.jwt.secret=${BTC_JWT_SECRET}
btc.security.jwt.issuer=${BTC_JWT_ISSUER:btc-flow}
