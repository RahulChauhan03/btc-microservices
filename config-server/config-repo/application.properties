management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Shared settings for every Config Server client. ${...} placeholders are served unresolved and
# resolved by each client from its OWN environment, so every client must receive these variables.
# No defaults for secrets: a client missing them fails at startup.

# Datasource credentials and JPA settings shared by user, trip, expense and claim services.
# Each service keeps its own JDBC URL (and database) in <service-name>.properties.
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Schema is owned by Flyway (classpath:db/migration in each service); Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway. An EMPTY database is migrated automatically. A database created earlier by Hibernate (no
# flyway_schema_history table) is refused unless BTC_FLYWAY_BASELINE_EXISTING=true is set for one start,
# after a backup; see docs/migrations/phase-4-flyway.md. Scripts are additive; clean is always disabled.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=1
spring.flyway.baseline-on-migrate=${BTC_FLYWAY_BASELINE_EXISTING:false}
spring.flyway.clean-disabled=true

# JWT settings shared by api-gateway, user, trip, expense and claim services (HS256).
btc.security.jwt.secret=${BTC_JWT_SECRET}
btc.security.jwt.issuer=${BTC_JWT_ISSUER:btc-flow}
