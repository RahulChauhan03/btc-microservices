spring.cloud.config.enabled=false
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
btc.security.jwt.secret=${random.uuid}${random.uuid}
btc.security.jwt.issuer=btc-flow-test

# Ordinary tests run on an in-memory H2 database (no MySQL needed). Flyway's MySQL scripts are verified
# separately against a real MySQL by the *MySqlTests tests (enabled with BTC_IT_MYSQL_URL).
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=${random.uuid}
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Outbox: tests drive OutboxProcessor directly (no background poll or immediate dispatch).
btc.outbox.scheduling-enabled=false
btc.outbox.dispatch-after-commit=false
