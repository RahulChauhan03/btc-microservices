<div class="page-grid">
  <header class="page-toolbar">
    <div>
      <span class="page-kicker">Administration</span>
      <h1>Employee directory</h1>
    </div>
    <a mat-stroked-button routerLink="/users"><mat-icon>manage_accounts</mat-icon>Manage accounts</a>
  </header>

  <section class="section-card table-card">
    <div class="table-head title-hidden">
      <div class="table-controls">
        <mat-form-field appearance="outline" class="table-search">
          <mat-icon matPrefix aria-hidden="true">search</mat-icon>
          <mat-label>Search by name or email</mat-label>
          <input matInput type="search" [formControl]="search" />
        </mat-form-field>
        <mat-form-field appearance="outline" class="table-filter">
          <mat-label>Role</mat-label>
          <mat-select [formControl]="role">
            <mat-option value="">All roles</mat-option>
            <mat-option value="EMPLOYEE">Employees</mat-option>
            <mat-option value="ADMIN">Administrators</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>

    @switch (state()) {
      @case ('loading') {
        <app-btc-loader message="Loading employees…" />
      }
      @case ('error') {
        <div class="empty-state" role="alert">
          <mat-icon aria-hidden="true">cloud_off</mat-icon>
          <strong>We couldn’t load the directory</strong>
          <button mat-flat-button type="button" (click)="load()">Try again</button>
        </div>
      }
      @default {
        <app-data-table
          title="Employees"
          [rows]="rows()"
          [columns]="tableColumns"
          [showTitle]="false"
          [showSearch]="false"
          paginationMode="server"
          [totalItems]="total()"
          [pageIndex]="page()"
          [pageSize]="pageSize()"
          [loading]="state() === 'loading'"
          [errorMessage]="state() === 'error' ? 'We couldn’t load the directory.' : null"
          emptyTitle="No matching people"
          emptyMessage="Try a different name, email or role."
          (pageChange)="onTablePageChange($event)"
          (retry)="load(page(), pageSize())"
        />
      }
    }
  </section>
</div>
