<div class="stat-card" [class.accent]="tone() === 'accent'">
  <div class="stat-head">
    <p>{{ label() }}</p>
    <span class="icon-wrap" aria-hidden="true">
      <mat-icon>{{ icon() }}</mat-icon>
    </span>
  </div>
  <p class="stat-value">
    @switch (format()) {
      @case ('currency') {
        {{ value() | currency: 'USD' : 'symbol' : '1.0-0' }}
      }
      @case ('percent') {
        {{ value() / 100 | percent: '1.0-0' }}
      }
      @default {
        {{ value() }}
      }
    }
  </p>
  @if (hint()) {
    <p class="stat-hint">{{ hint() }}</p>
  }
</div>
