<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BTC Flow</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1f3a" />
    <script>
      (() => {
        let theme = null;
        try {
          theme = localStorage.getItem('btc-flow-theme');
        } catch {
          // Continue with the system preference when storage is unavailable.
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        if (theme === 'dark') {
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#0f1117');
        }
      })();
    </script>
    <!-- Never send page paths (e.g. a password-reset link) to other origins such as the icon font host. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      name="description"
      content="BTC Flow: business travel, expenses and reimbursement claims in one workspace."
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
