spring.application.name=user-service
server.port=8081
# Required: shared datasource credentials, JPA and JWT settings come from Config Server (config-repo).
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

btc.bootstrap.admin.email=${BTC_ADMIN_EMAIL:}
btc.bootstrap.admin.password=${BTC_ADMIN_PASSWORD:}
